name: Build and publish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build dual-screen debug APK
        run: ./gradlew assembleDualscreenDebug --no-daemon

      - name: Prepare release asset
        id: apk
        shell: bash
        run: |
          apk_path="$(find app/build/outputs/apk/dualscreen/debug -maxdepth 1 -type f -name '*.apk' -print | sort | tail -n 1)"
          test -n "$apk_path"
          apk_name="YuzhuDual-${GITHUB_SHA::7}.apk"
          cp "$apk_path" "$apk_name"
          echo "path=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          tag="build-${GITHUB_SHA::7}"
          title="YuzhuDual ${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$APK_PATH" --clobber
          else
            gh release create "$tag" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "由提交 ${GITHUB_SHA} 自动构建的双屏 debug APK。" \
              --latest
          fi
